[package]
name = "robinwood-serwer"
description = "Baza danych (SQLite), migracje i API HTTP/WebSocket programu ROBINWOOD"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "robinwood_serwer"
path = "src/lib.rs"

[[bin]]
name = "robinwood-serwer"
path = "src/bin/robinwood-serwer.rs"

[dependencies]
tokio = { workspace = true, features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
mdns-sd = "0.13"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# Eksport ofert (Faza 2)
docx-rs = "0.4"
genpdf = { version = "0.2", features = ["images"] }
sha2 = "0.10"
# Ta sama wersja crate'a image co w genpdf (obrazy do PDF i DOCX)
image023 = { package = "image", version = "0.23", default-features = false, features = ["jpeg", "png"] }
# Generator Umów (Faza 3): szablony DOCX użytkownika
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Odczyt tekstu z PDF w testach eksportu (ta sama wersja co w printpdf)
lopdf = "0.26"
