[package]
name = "robinwood-serwer"
description = "Baza danych (SQLite), migracje i API HTTP/WebSocket programu ROBINWOOD"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "robinwood_serwer"
path = "src/lib.rs"

[[bin]]
name = "robinwood-serwer"
path = "src/bin/robinwood-serwer.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
mdns-sd = "0.13"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
