name: CI

on:
  push:
    branches: [main, "faza-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testy:
    name: Testy i lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Zależności systemowe Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: npm ci
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Testy frontendu (Vitest)
        run: npm test

      - name: Budowa frontendu
        run: npm run build

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  instalator-windows:
    name: Instalator Windows (NSIS)
    runs-on: windows-latest
    needs: testy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: npm ci
        run: npm ci

      # Odpowiednik tauri-action bez tworzenia wydania: sama budowa + artefakt.
      - name: Budowa instalatora
        run: npx tauri build --bundles nsis

      - name: Artefakt – instalator
        uses: actions/upload-artifact@v4
        with:
          name: robinwood-instalator-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
